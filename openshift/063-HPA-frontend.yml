kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: devops-quiz-frontend-hpa
spec:
  scaleTargetRef:
    kind: Deployment
    name: devops-quiz-frontend
    apiVersion: apps/v1
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
