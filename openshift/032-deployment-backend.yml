kind: Deployment
apiVersion: apps/v1
metadata:
  name: devops-quiz-backend
  labels:
    app: devops-quiz-app
    app.kubernetes.io/part-of: devops-quiz-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-quiz-backend
  template:
    metadata:
      labels:
        app: devops-quiz-backend
    spec:
      containers:
        - name: devops-quiz-backend
          image: ghcr.io/zenocavigelli/devops-quiz-backend:v1
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: devops-quiz-database-secret
                  key: database-host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: devops-quiz-database-secret
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devops-quiz-database-secret
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-quiz-database-secret
                  key: database-password
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          imagePullPolicy: Always
